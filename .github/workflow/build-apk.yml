name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Add native widgets and permissions
        run: |
          mkdir -p android/app/src/main/java/com/lumiere/app
          cp native/java/*.java android/app/src/main/java/com/lumiere/app/
          cp -r native/res/* android/app/src/main/res/
          python3 native/patch_manifest.py
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lumiere-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
