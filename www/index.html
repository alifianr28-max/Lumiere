const NP=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications,NF=new Set();
function nstat(){return NP?'Mode aplikasi Android: notifikasi dijadwalkan 14 hari ke depan dan tetap muncul saat aplikasi tertutup.':'Mode web: notifikasi muncul saat aplikasi terbuka. Untuk notifikasi saat aplikasi tertutup, pasang versi Android (APK) dari repositori. Izin browser: '+('Notification' in window?Notification.permission:'tidak didukung')+'.'}
async function nperm(){try{if(NP){const r=await NP.requestPermissions();return r.display=='granted'}if(!('Notification' in window))return false;return(await Notification.requestPermission())=='granted'}catch(e){return false}}
async function ntog(on){if(on&&!(await nperm())){S.nt=0;save();render();return toast('Izin notifikasi tidak diberikan atau tidak didukung di sini')}S.nt=on?1:0;save();nsync();render()}
async function nshow(t,b){try{if(NP){await NP.schedule({notifications:[{id:1,title:t,body:b,schedule:{at:new Date(Date.now()+1000)}}]});return}if(navigator.serviceWorker){const r=await navigator.serviceWorker.getRegistration();if(r){await r.showNotification(t,{body:b,icon:'icon-192.png'});return}}new Notification(t,{body:b})}catch(e){toast(t+': '+b)}}
setInterval(()=>{if(!S.nt||NP||!('Notification' in window)||Notification.permission!='granted')return;const T=td(),n=nowT();if(S.nk)act().forEach(t=>{if(!t.done&&t.date==T&&t.time==n&&!NF.has('t'+t.id)){NF.add('t'+t.id);nshow('Tugas',t.title)}});if(S.nh)ha().forEach(h=>{if(h.rm==n&&hsched(h,T)&&hpct(h,T)<100&&!NF.has('h'+h.id+T)){NF.add('h'+h.id+T);nshow('Kebiasaan',h.name)}});if(S.nj&&S.jr==n&&!NF.has('j'+T)){NF.add('j'+T);nshow('Jurnal','Waktunya menulis jurnal hari ini')}},20000);
let nst;function nsync(){clearTimeout(nst);nst=setTimeout(async()=>{if(!NP)return;try{const p=await NP.getPending();if(p.notifications.length)await NP.cancel({notifications:p.notifications});if(!S.nt)return;const L=[],T=td(),hh=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2000000000+2},at=(d,tm)=>{const[a,b]=tm.split(':'),x=pd(d);x.setHours(+a,+b,0,0);return x},now=new Date();for(let i=0;i<14;i++){const d=add(T,i);if(S.nk)act().forEach(t=>{if(!t.done&&t.date==d&&t.time){const w=at(d,t.time);if(w>now)L.push({id:hh('t'+t.id),title:'Tugas',body:t.title,schedule:{at:w,allowWhileIdle:true}})}});if(S.nh)ha().forEach(h=>{if(h.rm&&hsched(h,d)&&!(d==T&&hpct(h,d)>=100)){const w=at(d,h.rm);if(w>now)L.push({id:hh('h'+h.id+d),title:'Kebiasaan',body:h.name,schedule:{at:w,allowWhileIdle:true}})}});if(S.nj){const w=at(d,S.jr);if(w>now)L.push({id:hh('j'+d),title:'Jurnal',body:'Waktunya menulis jurnal hari ini',schedule:{at:w,allowWhileIdle:true}})}}if(L.length)await NP.schedule({notifications:L.slice(0,60)})}catch(e){}},1500)}
const WB=window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.registerPlugin?window.Capacitor.registerPlugin('WidgetBridge'):null;let wst;
function wsync(){if(!WB)return;clearTimeout(wst);wst=setTimeout(()=>{try{const T=td(),l=lvl();WB.update({data:JSON.stringify({tasks:act().filter(t=>t.date==T||isOver(t)).sort((a,b)=>(a.done?1:0)-(b.done?1:0)||((a.time||'99')<(b.time||'99')?-1:1)).slice(0,5).map(t=>({t:t.title,m:t.time||'',d:t.done?1:0})),pct:rate(),lv:l.n,ln:l.name,habits:ha().filter(h=>hsched(h,T)).slice(0,5).map(h=>({n:h.name,p:hpct(h,T)})),streak:Math.max(0,...ha().map(h=>hstreak(h).cur))})}).catch(()=>{})}catch(e){}},1200)}
function greet(){const h=new Date().getHours();return S.lang=='en'?(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', '+(S.name||'beautiful soul')+'.':(h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam')+', '+(S.name||'jiwa yang cantik')+'.'}
function home(){const dt=new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
const ws=S.w.filter(x=>x.on).map(x=>{const d=WD.find(w=>w[0]==x.id),z=x.s||d[2];return `<section class="w ${z} ${z=='s'?'alt':''}"><h3>${d[1]}</h3>${wbody(x.id)}</section>`}).join('');
return `<div class="hero"><div><h1>${greet()}</h1><q>${QT[S.q%QT.length]}</q><div class="row"><span class="chip">${dt}</span><button class="btn g" onclick="S.q++;save();render()">Kutipan lain</button></div></div><div class="hico">${IC[S.hi][1](rate())}<div class="hp">${rate()}%</div><div class="em" style="font-size:.8em">selesai hari ini</div></div></div>
<div class="sec"><h2>Hari ini</h2><button class="btn g" onclick="go('set','w')">Atur widget</button></div><div class="grid">${ws||'<p class="em">Semua widget disembunyikan. Aktifkan di Pengaturan.</p>'}</div>`}
function settings(){const th=Object.entries(TH).map(([k,v])=>{const c=dark()?v[3]:(v[2]||v[3]);return `<button class="tc ${S.theme==k?'on':''}" onclick="S.theme='${k}';save();render()" aria-pressed="${S.theme==k}"><div class="sw">${[0,1,2,3,4].map(i=>`<i style="background:#${c[i==0?0:i==1?1:i==2?2:i==3?3:4]}"></i>`).join('')}</div><b>${v[0]}</b><small>${v[1]}</small></button>`}).join('');
const fo=(k)=>Object.keys(FN).map(f=>`<option ${S[k]==f?'selected':''}>${f}</option>`).join('');
const sg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button class="${S[k]==v?'on':''}" onclick="S.${k}='${v}';save();render()">${l}</button>`).join('')}</div>`;
const wl=S.w.map((x,i)=>`<div class="wi"><input type="checkbox" ${x.on?'checked':''} aria-label="Tampilkan" onchange="S.w[${i}].on=this.checked;save()"><span>${WD.find(w=>w[0]==x.id)[1]}</span><select aria-label="Ukuran" style="padding:4px 8px" onchange="S.w[${i}].s=this.value;save()">${[['s','Kecil'],['m','Sedang'],['l','Besar']].map(([k,l])=>`<option value="${k}" ${(x.s||WD.find(w=>w[0]==x.id)[2])==k?'selected':''}>${l}</option>`).join('')}</select><button aria-label="Naik" onclick="mv(${i},-1)">↑</button><button aria-label="Turun" onclick="mv(${i},1)">↓</button></div>`).join('');
return `<div class="st"><h1>Pengaturan</h1>
<section><h2>Tema</h2><div class="th">${th}</div></section>
<section><h2>Mode tampilan</h2>${sg('mode',[['light','Terang'],['dark','Gelap'],['system','Sistem']])}<p class="em">Midnight Emerald dan Midnight Rose selalu gelap.</p></section>
<section><h2>Font</h2><div class="fr"><label>Font judul<select onchange="S.hf=this.value;save();render()">${fo('hf')}</select></label><label>Font isi<select onchange="S.bf=this.value;save();render()">${fo('bf')}</select></label><label>Ukuran: ${S.size}px<input type="range" min="14" max="20" value="${S.size}" style="accent-color:var(--pr)" oninput="S.size=+this.value;save();apply()" onchange="render()"></label><label>Ketebalan<select onchange="S.wt=+this.value;save();apply()">${[300,400,500,600].map(w=>`<option ${S.wt==w?'selected':''}>${w}</option>`).join('')}</select></label></div>
<div class="pv"><h4>Taman kecil setiap hari</h4><span class="em">Langkah kecil menciptakan perubahan besar.</span></div><p><button class="btn g" onclick="S.hf='Playfair Display';S.bf='Nunito';S.size=16;S.wt=400;save();render();toast('Font dikembalikan')">Kembalikan default</button></p></section>
<section><h2>Animasi dan tata letak</h2><div class="fr"><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" ${S.nomo?'checked':''} onchange="S.nomo=this.checked;save();apply()" style="accent-color:var(--pr)"> Kurangi gerakan</label>${sg('dens',[['cozy','Nyaman'],['dense','Padat']])}</div></section>
<section id="wsec"><h2>Widget beranda</h2><div class="wl">${wl}</div><p><button class="btn g" onclick="S.w=WD.map(x=>({id:x[0],on:true}));save();render();toast('Tata letak default dipulihkan')">Pulihkan tata letak</button></p></section>
<section><h2>Kebiasaan</h2><div class="fr"><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" ${S.an===0?'':'checked'} onchange="S.an=this.checked?1:0;save();apply()" style="accent-color:var(--pr)"> Animasi mekar</label><label>Durasi animasi: ${S.sp}x<input type="range" min="0.5" max="2" step="0.5" value="${S.sp}" style="accent-color:var(--pr)" onchange="S.sp=+this.value;save();render()"></label></div>${COL.map(([n,ks])=>`<p class="em" style="margin:10px 0 4px">${n}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${ks.map(k=>`<button class="mb ${S.hi==k?'on':''}" style="width:88px" aria-pressed="${S.hi==k}" onclick="S.hi='${k}';save();render()">${IC[k][1](60)}<span>${IC[k][0]}</span></button>`).join('')}</div>`).join('')}<p class="em" style="margin-top:16px">Pratinjau tahap: <b id="pvn">60%</b></p><div style="display:flex;gap:16px;align-items:center"><div style="width:110px" id="pvi">${IC[S.hi][1](60)}</div><input type="range" min="0" max="100" value="60" aria-label="Pratinjau tahap" style="flex:1;accent-color:var(--pr)" oninput="$('#pvi').innerHTML=IC[S.hi][1](+this.value);$('#pvn').textContent=this.value+'%'"></div><p class="em">Ikon ini dipakai di semua kebiasaan dan di beranda.</p></section>
<section><h2>Umum</h2><div class="fr"><label>Bahasa<select onchange="S.lang=this.value;save();render()"><option value="id" ${S.lang!='en'?'selected':''}>Indonesia</option><option value="en" ${S.lang=='en'?'selected':''}>English (sebagian)</option></select></label><label>Format tanggal<select onchange="S.df=this.value;save();render()">${[['long','17 Nov'],['dmy','17/11/2026'],['mdy','11/17/2026'],['ymd','2026-11-17']].map(([k,l])=>`<option value="${k}" ${S.df==k?'selected':''}>${l}</option>`).join('')}</select></label><label>Zona waktu<select onchange="S.tz=this.value;save();render()">${TZ.map(([k,l])=>`<option value="${k}" ${S.tz==k?'selected':''}>${l}</option>`).join('')}</select></label><label>Awal minggu<select onchange="S.sw=+this.value;save();render()"><option value="1" ${S.sw!==0?'selected':''}>Senin</option><option value="0" ${S.sw===0?'selected':''}>Minggu</option></select></label></div><p class="em">English baru mencakup menu, sapaan, serta nama hari dan bulan. Awal minggu berlaku di kalender, kalender mood, dan ringkasan mingguan.</p></section>
<section><h2>Notifikasi</h2><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" ${S.nt?'checked':''} onchange="ntog(this.checked)" style="accent-color:var(--pr)"> Aktifkan notifikasi</label><div class="fr" style="margin-top:12px"><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" ${S.nk?'checked':''} onchange="S.nk=this.checked?1:0;save();nsync()" style="accent-color:var(--pr)"> Tugas berjam</label><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" ${S.nh?'checked':''} onchange="S.nh=this.checked?1:0;save();nsync()" style="accent-color:var(--pr)"> Pengingat kebiasaan</label><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" ${S.nj?'checked':''} onchange="S.nj=this.checked?1:0;save();nsync()" style="accent-color:var(--pr)"> Jurnal harian pukul <input type="time" value="${S.jr}" onchange="S.jr=this.value||'20:00';save();nsync()"></label></div><p class="em">${nstat()}</p><button class="btn g" onclick="nshow('Lumière','Notifikasi berhasil')">Kirim notifikasi tes</button></section>
<section><h2>Data dan bantuan</h2><div class="fr"><button class="btn g" onclick="bkopen()">Cadangkan dan pulihkan</button><button class="btn g" onclick="rst()">Hapus semua data</button></div><p class="em">Data tersimpan hanya di browser ini. Menghapus data browser akan menghapusnya, jadi buat cadangan secara berkala.</p><details><summary>Tentang Lumière</summary><p class="em">Versi 1.0. Tidak ada login atau sinkronisasi antar perangkat. Asisten berbasis aturan, bukan AI generatif. Notifikasi push, widget layar utama native, dan instalasi PWA belum tersedia di halaman ini karena butuh layanan atau berkas yang tidak bisa dihosting di sini. Pengaturan bahasa, format tanggal, zona waktu, dan awal minggu belum tersedia.</p></details></section>
<section><h2>Asisten</h2><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" ${S.ai===0?'':'checked'} onchange="S.ai=this.checked?1:0;save();render()" style="accent-color:var(--pr)"> Aktifkan asisten</label><p class="em">Asisten berbasis aturan dan berjalan di perangkat ini. Isi jurnalmu tidak dibaca.</p></section>
<section><h2>Profil</h2><label class="em">Nama panggilan<br><input type="text" value="${S.name.replace(/"/g,'')}" maxlength="30" placeholder="Nama kamu" oninput="S.name=this.value;save()"></label></section></div>`}
function mv(i,d){const j=i+d;if(j<0||j>=S.w.length)return;[S.w[i],S.w[j]]=[S.w[j],S.w[i]];save();render();$('#wsec')?.scrollIntoView()}
function go(p,x){S.page=p;save();render();scrollTo(0,0);if(x)setTimeout(()=>$('#wsec')?.scrollIntoView(),50)}
function qa(){$('#sh').classList.toggle('on')}
function render(){apply();const n=NAV.map(([k,l,p])=>`<button class="nb ${S.page==k?'on':''}" onclick="go('${k}')" ${S.page==k?'aria-current="page"':''}>${ic(p)}<span>${tr(l)}</span></button>`).join('');
const bn=['home','tasks','habits','cal','set'].map(k=>NAV.find(x=>x[0]==k)).map(([k,l,p])=>`<button class="nb ${S.page==k?'on':''}" onclick="go('${k}')">${ic(p)}<span>${tr(l).split(' ')[0]}</span></button>`).join('');
const body=S.page=='home'?home():S.page=='set'?settings():S.page=='habits'?habPage():S.page=='goals'?goalPage():S.page=='ins'?insPage():S.page=='ach'?achPage():S.page=='mood'?moodPage():S.page=='jour'?jourPage():S.page=='tasks'?tasksPage():S.page=='cal'?calPage():`<div class="pg"><h1>${PH[S.page][0]}</h1><div class="ph"><p class="em">Modul ini dijadwalkan pada ${PH[S.page][1]}. Fondasi desain, tema, dan navigasi sudah siap.</p></div></div>`;
const init=(S.name||'L')[0].toUpperCase();
$('#r').innerHTML=`<div class="app ${S.min?'min':''}"><aside><div class="logo">${sun(100).replace('<svg ','<svg width="30" height="34" ')}<span>Lumière</span></div>${n}<div class="sp"></div><button class="nb" onclick="S.min=!S.min;save();render()" aria-label="Perkecil sidebar">${ic('M15 6l-6 6 6 6')}<span>Perkecil</span></button></aside>
<main><header class="top"><span class="d">Ruang pribadimu</span><label class="srch">${ic('M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4-4',16)}<input type="text" placeholder="Cari" aria-label="Cari" onkeydown="if(event.key=='Enter'){S.tq=this.value;S.tv='all';go('tasks')}"></label>${S.ai===0?'':'<button class="ib" aria-label="Asisten" onclick="asst()">'+ic('M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z',18)+'</button>'}<button class="ib" aria-label="Notifikasi" onclick="notif()">${ic('M6 9a6 6 0 0112 0c0 6 3 7 3 7H3s3-1 3-7zM10 20a2 2 0 004 0',18)}</button><button class="av" aria-label="Profil, ${lvl().s}" title="${lvl().s}" onclick="go('set')"><span>${init}</span><b class="lb">${lvl().n}</b></button></header>${body}</main></div>
<nav class="bot">${bn}</nav><button class="fab" aria-label="Tambah" onclick="qa()">${ic('M12 5v14M5 12h14',24)}</button>
<div class="sheet" id="sh" onclick="if(event.target==this)qa()"><div><h3>Tambah cepat</h3><div class="qa">${[['Tugas','M4 6h16M4 12h16M4 18h10','Phase 2'],['Kebiasaan','M12 21V9M12 9c0-4 3-6 7-6 0 4-3 6-7 6z','Phase 3'],['Mood','M12 21a9 9 0 100-18 9 9 0 000 18zM8 14c1 2 7 2 8 0','Phase 4'],['Jurnal','M6 3h12v18H6zM9 8h6','Phase 4']].map(([l,p,ph])=>`<button onclick="qa();${l=='Tugas'?'tform()':l=='Kebiasaan'?'hform()':l=='Mood'?"go('mood')":l=='Jurnal'?'jnew()':`toast('${l} tersedia di ${ph}')`}">${ic(p)}${l}</button>`).join('')}</div></div></div>`}
chk=(c=>()=>{c();nsync();wsync()})(chk);
render=(r=>()=>{r();chk()})(render);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>S.mode=='system'&&render());
render();
</script></body></html>
